# Copy to secret.yaml (gitignored) or apply once with kubectl:
# kubectl -n mongols-app create secret generic mongols-app-secrets \
#   --from-literal=CLOUDFLARE_TURNSTILE_SECRET_KEY='your-secret'
#
# Do not commit real values.
apiVersion: v1
kind: Secret
metadata:
  name: mongols-app-secrets
  namespace: mongols-app
  labels:
    app.kubernetes.io/name: mongols-app
type: Opaque
stringData:
  CLOUDFLARE_TURNSTILE_SECRET_KEY: "REPLACE_ME"

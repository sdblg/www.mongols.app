apiVersion: v1
kind: ConfigMap
metadata:
  name: mongols-app-config
  namespace: mongols-app
  labels:
    app.kubernetes.io/name: mongols-app
data:
  NODE_ENV: "production"
  PORT: "3000"
  # Public Turnstile site key (safe in ConfigMap). Override per environment if needed.
  NEXT_PUBLIC_CLOUDFLARE_TURNSTILE_SITE_KEY: ""

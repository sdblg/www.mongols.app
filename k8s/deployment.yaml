apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongols-app-web
  namespace: mongols-app
  labels:
    app.kubernetes.io/name: mongols-app
    app.kubernetes.io/component: web
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: mongols-app
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mongols-app
        app.kubernetes.io/component: web
    spec:
      securityContext:
        fsGroup: 1001
      containers:
        - name: web
          image: MONGOLS_IMAGE_PLACEHOLDER
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: mongols-app-config
                optional: false
            - secretRef:
                name: mongols-app-secrets
                optional: true
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
      terminationGracePeriodSeconds: 30
